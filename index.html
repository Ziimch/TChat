<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#07101f"><meta name="description" content="TChat V5.3 — chat realtime ringan untuk mobile"><title>TChat V5.3 HP</title><link rel="icon" type="image/jpeg" href="logo.jpg"><link rel="apple-touch-icon" href="logo.jpg"><link rel="stylesheet" href="style.css">
</head>
<body><div class="app">
<header><div class="brand"><img class="logo" src="logo.jpg" alt="TChat"><div><b>TChat <small>V5.3</small></b><span id="status">Menghubungkan…</span></div></div><div class="head-actions"><button id="profile" title="Profil">👤</button><button id="sound" title="Suara">🔔</button><button id="theme" title="Tema">☀</button><button id="reload" title="Muat ulang">↻</button></div></header>
<div class="profile-strip"><span>👤 <b id="profileName">Anonim</b></span><span>Pesan otomatis kedaluwarsa 7 hari</span></div>
<div class="toolbar"><div class="searchbox"><span>⌕</span><input id="search" autocomplete="off" placeholder="Cari pesan…"><button id="clearSearch">×</button></div></div>
<main id="messages"><div class="loading">Memuat chat…</div></main><div id="jumpWrap" class="jump-wrap" hidden><button id="jumpBottom" class="jump">↓ <span id="unreadCount">0</span> pesan baru</button><button id="closeJump" class="jump-close" aria-label="Tutup pesan baru" title="Tutup">×</button></div>
<footer><div id="replybar" class="replybar" hidden><div><b id="replyName">Anonim</b><span id="replyText">Pesan</span></div><button id="cancelReply">×</button></div>
<div class="quickbar"><button class="quick" data-e="👍">👍</button><button class="quick" data-e="😂">😂</button><button class="quick" data-e="🔥">🔥</button><button class="quick" data-e="❤️">❤️</button><button class="quick" data-e="🎁">🎁</button></div><div class="media"><select id="type"><option value="text">💬 Teks</option><option value="image">🖼️ Gambar</option><option value="gift">🎁 Gift</option></select><input id="url" maxlength="200" placeholder="URL gambar/gift (https://…)" hidden></div><div class="compose"><textarea id="text" maxlength="200" rows="1" autocomplete="off" enterkeyhint="send" placeholder="Tulis pesan…"></textarea><button id="send">Kirim</button></div><div class="count"><span id="count">0</span>/200 · Tersimpan maksimal 7 hari</div></footer><div id="toast" class="toast"></div></div><script type="module" src="app.js"></script></body></html>
