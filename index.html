<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat Anonim Real-Time</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    background: #fff;
  }
  #messages div {
    margin-bottom: 10px;
  }
  #messageForm {
    display: flex;
    padding: 10px;
    background: #ddd;
  }
  #messageInput {
    flex: 1;
    padding: 8px;
    font-size: 16px;
  }
  #sendBtn {
    padding: 8px 16px;
    font-size: 16px;
    margin-left: 10px;
  }
</style>
</head>
<body>

<h2 style="text-align:center;">TChat</h2>
<div id="messages"></div>
<form id="messageForm">
  <input type="text" id="messageInput" placeholder="Ketik pesan..." autocomplete="off" required />
  <button type="submit" id="sendBtn">Kirim</button>
</form>

<script>
  // Konfigurasi Firebase Anda
  const firebaseConfig = {
    apiKey: "AIzaSyBkvcyWuddpddsGmuC5M0w5mzm5v4AIErk",
    authDomain: "tchatanonim.firebaseapp.com",
    databaseURL: "https://tchat-83a53.firebaseio.com",
    projectId: "tchat-83a53",
    storageBucket: "tchat-83a53.appspot.com",
    messagingSenderId: "679108429003",
    appId: "1:679108429003:web:271e5b94ceae3fddeb074e"
  };

  // Inisialisasi Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const messagesRef = db.ref('messages');

  const messagesDiv = document.getElementById('messages');
  const messageForm = document.getElementById('messageForm');
  const messageInput = document.getElementById('messageInput');

  // Menampilkan pesan secara real-time
  messagesRef.on('child_added', snapshot => {
    const message = snapshot.val();
    const messageDiv = document.createElement('div');
    messageDiv.textContent = message.text;
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });

  // Mengirim pesan
  messageForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (text !== '') {
      messagesRef.push({ text: text });
      messageInput.value = '';
    }
  });
</script>

</body>
</html>
