<script>
/* Auto cache-buster: detects a newer deployed version and force-reloads without
   requiring the user to manually refresh. Bump BUILD_ID on every deploy. */
(function(){
  var BUILD_ID = "2026-09-23-r4";
  try {
    if (sessionStorage.getItem("tchat_no_redirect")) return;
    fetch(location.pathname, { cache: "no-store" })
      .then(function(r){ return r.text(); })
      .then(function(html){
        var m = html.match(/BUILD_ID\s*=\s*"([^"]+)"/);
        if (m && m[1] && m[1] !== BUILD_ID) {
          sessionStorage.setItem("tchat_no_redirect", "1");
          location.replace(location.pathname + "?v=" + Date.now());
        }
      })
      .catch(function(){});
  } catch(e) {}
})();
</script>

<script>
(async function(){
"use strict";

/* ---------- Block devtools shortcuts (cosmetic only, not real protection) ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "u")) {
    e.preventDefault();
    return false;
  }
});

/* ---------- DOM refs ---------- */
const chatBox       = document.getElementById("chatBox");
const mediaModal    = document.getElementById("mediaModal");
const mediaTitle    = document.getElementById("mediaTitle");
const mediaClose    = document.getElementById("mediaClose");
const imageBtn      = document.getElementById("imageBtn");
const giftBtn       = document.getElementById("giftBtn");
const imagePanel    = document.getElementById("imagePanel");
const giftPanel     = document.getElementById("giftPanel");
const imageUrlInput = document.getElementById("imageUrlInput");
const imagePreview  = document.getElementById("imagePreview");
const imagePreviewWrap = document.getElementById("imagePreviewWrap");
const imageSendBtn  = document.getElementById("imageSendBtn");
const giftGrid      = document.getElementById("giftGrid");
const scrollAnchor   = document.getElementById("scrollAnchor");
const messageForm    = document.getElementById("messageForm");
const messageInput   = document.getElementById("messageInput");
const sendBtn        = document.getElementById("sendBtn");
const statusDot      = document.getElementById("statusDot");
const statusText     = document.getElementById("statusText");
const userNameBadge  = document.getElementById("userNameBadge");
const loadingMsg     = document.getElementById("loadingMsg");
const toastEl        = document.getElementById("toast");
const typingIndicator= document.getElementById("typingIndicator");
const charCount      = document.getElementById("charCount");
const jumpBtn        = document.getElementById("jumpBtn");
const jumpCount      = document.getElementById("jumpCount");
const replyBox       = document.getElementById("replyBox");
const replyTxt       = document.getElementById("replyTxt");

/* ---------- Toast (defined early so any early failure can safely use it) ---------- */
window.sT = function(msg){
  toastEl.textContent = msg;
  toastEl.classList.remove("opacity-0", "translate-y-2");
  setTimeout(() => toastEl.classList.add("opacity-0", "translate-y-2"), 2500);
};

/* ---------- Notification sound + theme ---------- */
const pop = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
let soundOn = true;

const THEMES = [
  {c1:"#3b82f6",c2:"#2563eb"}, {c1:"#a855f7",c2:"#7e22ce"}, {c1:"#10b981",c2:"#047857"},
  {c1:"#f43f5e",c2:"#be123c"}, {c1:"#f59e0b",c2:"#d97706"}, {c1:"#ec4899",c2:"#be185d"}
];
let themeIdx = parseInt(localStorage.getItem("tch_thm")) || 0;
function applyTheme(){
  document.documentElement.style.setProperty("--thm-bg1", THEMES[themeIdx].c1);
  document.documentElement.style.setProperty("--thm-bg2", THEMES[themeIdx].c2);
}
applyTheme();
document.getElementById("themeBtn").onclick = () => {
  themeIdx = (themeIdx + 1) % THEMES.length;
  localStorage.setItem("tch_thm", themeIdx);
  applyTheme();
};

document.getElementById("sndBtn").onclick = (e) => {
  soundOn = !soundOn;
  e.currentTarget.innerHTML = soundOn ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
  e.currentTarget.classList.toggle("text-red-400", !soundOn);
};

document.getElementById("clrBtn").onclick = () => {
  chatBox.innerHTML = '<div class="text-center w-full my-6"><span class="bg-gray-900/60 text-yellow-500/80 text-[10px] px-4 py-1.5 rounded-full font-medium tracking-wide uppercase"><i class="fa-solid fa-broom mr-1"></i> Layar Dibersihkan (lokal)</span></div>';
  chatBox.appendChild(scrollAnchor);
  msgStore.clear();
};

/* ---------- Search ---------- */
const searchBox = document.getElementById("searchBox");
const searchInput = document.getElementById("searchInput");
document.getElementById("searchBtn").onclick = () => {
  searchBox.classList.toggle("hidden");
  if (!searchBox.classList.contains("hidden")) searchInput.focus();
};
document.getElementById("closeSearch").onclick = () => {
  searchBox.classList.add("hidden");
  searchInput.value = "";
  document.querySelectorAll(".msg-row").forEach(r => r.style.display = "");
};
searchInput.oninput = () => {
  const q = searchInput.value.toLowerCase();
  document.querySelectorAll(".msg-row").forEach(r => {
    const t = r.getAttribute("data-text") || "";
    r.style.display = t.includes(q) ? "flex" : "none";
  });
};

/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyAC5Hzg9DInPVYJcKTM3bPKXE-OjzpvIGI",
  authDomain: "tchat-v2-ab202.firebaseapp.com",
  databaseURL: "https://tchat-v2-ab202-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tchat-v2-ab202",
  storageBucket: "tchat-v2-ab202.firebasestorage.app",
  messagingSenderId: "417009845131",
  appId: "1:417009845131:web:04d20be9eb471652b1258e"
};

function showFatalError(title, detail){
  loadingMsg.innerHTML = `
    <i class="fa-solid fa-triangle-exclamation text-red-500 text-3xl mb-3"></i>
    <span class="text-red-400 font-bold px-6 text-center">${title}</span>
    <span class="text-gray-500 text-[11px] px-8 text-center mt-1.5">${detail}</span>
    <button id="retryBtn" class="mt-4 bg-white/10 hover:bg-white/20 text-white text-xs font-bold px-4 py-2 rounded-full">Coba Lagi</button>`;
  loadingMsg.classList.remove("opacity-0", "pointer-events-none");
  const retryBtn = document.getElementById("retryBtn");
  if (retryBtn) retryBtn.onclick = () => location.reload();
}

let db, messagesRef, connectedRef, typingRef, typingRootRef, presenceRef, presenceRootRef;
let isFirebaseConnected = false;
let currentUid = null;

if (typeof firebase === "undefined") {
  showFatalError("Gagal Memuat Sistem Chat", "Skrip Firebase tidak berhasil dimuat. Periksa koneksi internet Anda lalu coba lagi.");
} else {
  try {
    firebase.initializeApp(firebaseConfig);

    // Anonymous Auth: wajib agar Firebase Rules yang aman dapat menerima request.
    if (!firebase.auth || typeof firebase.auth !== "function") {
      throw new Error("Firebase Auth SDK tidak dimuat");
    }
    await firebase.auth().signInAnonymously();
    console.info("TChat Firebase Auth OK:", firebase.auth().currentUser.uid);

    /*
     * CONNECTION FIX
     * Beberapa jaringan/operator seluler/proxy dapat membuat WebSocket
     * Firebase RTDB macet di "Menghubungkan...". Firebase menyediakan
     * forceLongPolling() untuk memaksa transport yang lebih kompatibel.
     * Dipanggil sebelum ref/listener apa pun dibuat.
     */
    try {
      if (firebase.database && firebase.database.INTERNAL &&
          typeof firebase.database.INTERNAL.forceLongPolling === "function") {
        firebase.database.INTERNAL.forceLongPolling();
      }
    } catch (transportErr) {
      console.warn("TChat: long-polling fallback tidak tersedia:", transportErr);
    }

    db = firebase.database();
    messagesRef    = db.ref("messages");
    connectedRef   = db.ref(".info/connected");
    typingRootRef  = db.ref("typing");
    presenceRootRef= db.ref("presence");
    const uid = firebase.auth().currentUser.uid;
    currentUid = uid;
    typingRef      = typingRootRef.child(uid);
    presenceRef    = presenceRootRef.child(uid);

    // Pastikan SDK mencoba konek lagi ketika browser kembali online.
    window.addEventListener("online", () => {
      try { db.goOnline(); } catch (e) {}
      isFirebaseConnected = false;
      renderConnectionState("connecting");
    });

    window.addEventListener("offline", () => {
      isFirebaseConnected = false;
      renderConnectionState("offline");
    });
  } catch (err) {
    console.error("TChat Firebase init error:", err);
    sT("Gagal muat sistem.");
    showFatalError("Gagal Memuat TChat", "Firebase/Auth gagal. Pastikan Anonymous Authentication aktif, Realtime Database sudah dibuat, dan databaseURL sesuai project.");
  }
}

// Connection watchdog: jangan biarkan UI berputar selamanya.
let connectionWatchdog = null;
if (db && connectedRef) {
  connectionWatchdog = setTimeout(() => {
    if (!isFirebaseConnected) {
      if (navigator.onLine === false) {
        showFatalError("Tidak Ada Koneksi Internet", "Perangkat sedang offline. Setelah internet aktif, tekan Coba Lagi.");
      } else {
        showFatalError(
          "Koneksi Database Gagal",
          "Firebase belum merespons. Coba jaringan lain atau periksa Firebase Realtime Database Rules."
        );
      }
    }
  }, 15000);
}

/* ---------- Identity ---------- */
let myName = localStorage.getItem("tchat_name");
if (!myName) {
  myName = "Anon-" + Math.floor(1000 + Math.random() * 9000);
  try { localStorage.setItem("tchat_name", myName); } catch(e) {}
}
const avatarUrl = (seed) => `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(seed)}&backgroundColor=1f2937`;

document.getElementById("myNameTxt").textContent = myName;
document.getElementById("myAvatar").src = avatarUrl(myName);
userNameBadge.classList.remove("hidden");
userNameBadge.onclick = () => {
  const val = prompt("Ganti Nama Anda (Maks 15 karakter):", myName);
  if (val === null) return;
  const trimmed = val.trim();
  if (trimmed.length > 0 && trimmed.length <= 15) {
    myName = trimmed;
    localStorage.setItem("tchat_name", myName);
    document.getElementById("myNameTxt").textContent = myName;
    document.getElementById("myAvatar").src = avatarUrl(myName);
    sT("Nama berhasil diubah!");
  } else {
    sT("Nama tidak valid!");
  }
};

/* ---------- Local draft ---------- */
try {
  const savedDraft = localStorage.getItem("tchat_draft") || "";
  messageInput.value = savedDraft;
  updateCharCount();
} catch(e){}
messageInput.addEventListener("input", () => {
  try { localStorage.setItem("tchat_draft", messageInput.value); } catch(e){}
});

/* ---------- Connection status + presence ---------- */
let presenceKey = null;
let onlineCount = 0;

let hasEverConnected = false;
let reconnectTimer = null;

function renderConnectionState(state){
  statusDot.classList.remove("bg-red-500","bg-yellow-500","bg-green-500");
  statusText.classList.remove("text-gray-400","text-gray-500","text-yellow-400","text-emerald-400");

  if(state === "online"){
    hasEverConnected = true;
    statusDot.classList.add("bg-green-500");
    statusText.classList.add("text-emerald-400");
    // Keep connection text independent from the online-user counter.
    statusText.textContent = "Online";
    messageInput.disabled = false;
    sendBtn.disabled = false;
    loadingMsg.classList.add("opacity-0","pointer-events-none");
    if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer=null; }
  } else if(state === "offline"){
    statusDot.classList.add("bg-red-500");
    statusText.classList.add("text-gray-400");
    statusText.textContent = "Offline";
    messageInput.disabled = true;
    sendBtn.disabled = true;
  } else {
    statusDot.classList.add("bg-yellow-500");
    statusText.classList.add("text-yellow-400");
    statusText.textContent = hasEverConnected ? "Menyambung ulang..." : "Menghubungkan...";
    messageInput.disabled = true;
    sendBtn.disabled = true;
  }
}

function updateStatusText(){
  if(isFirebaseConnected) renderConnectionState("online");
}

if (connectedRef) {
  connectedRef.on("value", (snap) => {
    const connected = snap.val() === true;
    isFirebaseConnected = connected;

    if (connected) {
      if (connectionWatchdog) { clearTimeout(connectionWatchdog); connectionWatchdog = null; }
      renderConnectionState("online");

      if (presenceRef && !presenceKey && currentUid) {
        presenceKey = currentUid;
        presenceRef.onDisconnect().set({ online:false, lastSeen:firebase.database.ServerValue.TIMESTAMP }).catch(()=>{});
        presenceRef.set({ online:true, lastSeen:firebase.database.ServerValue.TIMESTAMP }).catch(()=>{});
      }
    } else {
      presenceKey = null;
      renderConnectionState(navigator.onLine === false ? "offline" : "connecting");
    }
  }, (err) => {
    console.error("TChat connection listener error:", err);
    isFirebaseConnected = false;
    renderConnectionState("offline");
    showFatalError("Tidak Bisa Terhubung ke Database","Akses ke Firebase ditolak atau database tidak tersedia. Periksa Rules dan URL Realtime Database.");
  });
}

if (presenceRootRef) {
  presenceRootRef.on("value", (snap) => {
    let count = 0;
    snap.forEach(child => { const v = child.val(); if(v && v.online === true) count++; });
    onlineCount = count;
    // Do not overwrite the connection state with the online-user counter.
    // The counter can update independently while the connection remains Online.
  });
}

/* ---------- Reply state ---------- */
let replyState = null; // {n: name, m: message}
document.getElementById("closeReply").onclick = () => {
  replyState = null;
  replyBox.classList.add("hidden");
};
function setReply(name, msg){
  replyState = { n: name, m: msg };
  replyTxt.textContent = "Balas " + name + ": " + (msg.length > 25 ? msg.substring(0, 25) + "..." : msg);
  replyBox.classList.remove("hidden");
  messageInput.focus();
}

/* ---------- Emoji buttons ---------- */
document.querySelectorAll(".emj-btn").forEach(btn => {
  btn.onclick = () => { messageInput.value += btn.innerText; messageInput.focus(); updateCharCount(); };
});

/* ---------- Typing indicator ---------- */
let typingLock = false;
messageInput.oninput = () => {
  updateCharCount();
  if (!typingLock && typingRef) {
    typingLock = true;
    typingRef.set(true).catch(() => {});
    setTimeout(() => { typingLock = false; typingRef.set(false).catch(() => {}); }, 2000);
  }
};
function updateCharCount(){
  const len = messageInput.value.length;
  charCount.textContent = `${len}/130`;
  charCount.classList.toggle("text-red-400", len >= 120);
  charCount.classList.toggle("text-gray-600", len < 120);
}
if (typingRootRef) {
  typingRootRef.on("value", (snap) => {
    let someoneTyping = false;
    snap.forEach(child => {
      if (child.key !== currentUid && child.val() === true) someoneTyping = true;
    });
    if (someoneTyping) {
      typingIndicator.textContent = "Seseorang sedang mengetik...";
      typingIndicator.classList.remove("hidden");
    } else {
      typingIndicator.classList.add("hidden");
      typingIndicator.textContent = "";
    }
  });
}

/* ---------- Safe text formatting (escapes HTML first, then applies limited markdown) ---------- */
function safeUrl(url){
  try { const u = new URL(url); return (u.protocol === "https:" || u.protocol === "http:") ? u.href : null; } catch(e){ return null; }
}

function mediaHtml(v){
  if (!v || !v.url) return null;
  const url = safeUrl(v.url);
  if (!url) return null;
  if (v.type === "image") return `<img src="${url.replace(/\"/g,"&quot;")}" class="message-media" loading="lazy" alt="Gambar" onerror="this.outerHTML='<span class=\"text-red-400 text-xs italic\">[Gambar gagal dimuat]</span>'">`;
  if (v.type === "gift") return `<img src="${url.replace(/\"/g,"&quot;")}" class="gift-media" loading="lazy" alt="Gift" onerror="this.outerHTML='<span class=\"text-red-400 text-xs italic\">[Gift gagal dimuat]</span>'"><div class="media-caption">${(v.caption || "Gift").replace(/[&<>]/g,"")}</div>`;
  return null;
}

function formatMessage(raw){
  const div = document.createElement("div");
  div.textContent = raw;
  let html = div.innerHTML; // fully HTML-escaped at this point

  // quoted reply block: "> Name | snippet"
  html = html.replace(/\n?&gt; (.*?) \| (.*?)\n/g,
    "<div class='border-l-[3px] border-[var(--thm-bg1)] pl-2 ml-1 my-1 text-[11px] bg-gray-900/40 rounded p-1.5 opacity-90 text-gray-300'><b>$1</b><br><span class='italic'>$2</span></div>");

  // links / inline images
  html = html.replace(/(https?:\/\/[^\s]+)/g, (url) => {
    if (/\.(jpeg|jpg|gif|png|webp)$/i.test(url)) {
      return `<img src="${url}" class="mt-2 rounded-lg max-h-48 max-w-full object-cover border border-gray-600/50 shadow-md" loading="lazy" onload="sC()" onerror="this.outerHTML='&lt;span class=\\'text-red-400 text-xs italic\\'&gt;[Gambar Gagal]&lt;/span&gt;'.replace(/&lt;/g,'<').replace(/&gt;/g,'>')">`;
    }
    return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="underline text-blue-300">${url}</a>`;
  });

  html = html.replace(/\*(.*?)\*/g, "<b class='font-bold'>$1</b>");
  html = html.replace(/_(.*?)_/g, "<i class='italic'>$1</i>");
  html = html.replace(/~(.*?)~/g, "<strike class='opacity-70'>$1</strike>");
  return html;
}

/* ---------- Message store (avoids ever embedding raw user text inside onclick="") ---------- */
const msgStore = new Map(); // id -> {sender, text, type, url, caption}
const localReactions = new Map(); // local-only UI reactions, no database write
let rowSeq = 0;

/* ---------- Render a message row ---------- */
function renderMessage(id, sender, text, ts, isSystem = false, media = null){
  const isMe = sender === myName;
  const row = document.createElement("div");
  const nearBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 80;

  row.className = `flex w-full msg-row msg-enter ${isMe || isSystem ? "justify-end" : "justify-start"} gap-2 ${isSystem ? "opacity-80 scale-95" : ""}`;
  row.setAttribute("data-text", (sender + " " + (text || "") + " " + (media?.caption || "")).toLowerCase());
  row.setAttribute("data-msg-id", id);
  msgStore.set(id, { sender, text, type: media?.type || "text", url: media?.url || "", caption: media?.caption || "" });

  const time = (ts ? new Date(ts) : new Date()).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  const avatar = isSystem ? "https://api.dicebear.com/7.x/bottts/svg?seed=System&backgroundColor=ef4444" : avatarUrl(sender);
  const bodyHtml = media ? (mediaHtml(media) || formatMessage(text || "")) : formatMessage(text || "");

  const nameLabel = document.createElement("span");
  nameLabel.className = "text-[10px] font-bold text-gray-500 mb-0.5 ml-1 drop-shadow-sm";
  nameLabel.textContent = sender; // safe: textContent, not innerHTML

  const avatarImg = `<img src="${avatar}" class="w-8 h-8 rounded-full bg-gray-800 flex-shrink-0 mt-1 shadow-sm border border-gray-700">`;

  const bubble = document.createElement("div");
  bubble.className = "flex flex-col " + (isMe || isSystem ? "items-end" : "items-start") + " max-w-[75%]";
  bubble.innerHTML = `
    <div data-action="copy" class="px-4 py-2 cursor-pointer ${isMe ? "bubble-me text-white rounded-2xl rounded-tr-sm" : isSystem ? "bg-amber-500/10 text-amber-200 rounded-2xl rounded-tr-sm border border-amber-500/20" : "bubble-other text-gray-100 rounded-2xl rounded-tl-sm"}">
      <p class="text-[14.5px] leading-relaxed break-words">${bodyHtml}</p>
    </div>
    <span class="text-[9px] font-medium text-gray-600 mt-1 ${isMe || isSystem ? "mr-1" : "ml-1"} flex items-center gap-2">
      ${time}
      ${isMe && !isSystem ? `<i class="fa-solid fa-check text-[8px] opacity-70" title="Terkirim"></i>` : ""}
      ${!isMe && !isSystem ? `<button data-action="reply" class="text-[var(--thm-bg1)] hover:text-white transition-colors" title="Balas"><i class="fa-solid fa-reply"></i></button>` : ""}
    </span>`;
  if (!isMe && !isSystem) bubble.prepend(nameLabel);

  if (!isMe && !isSystem) row.insertAdjacentHTML("beforeend", avatarImg);
  row.appendChild(bubble);
  if (isMe || isSystem) row.insertAdjacentHTML("beforeend", avatarImg);

  // Double-tap/click on a message opens a small local reaction picker.
  let pressTimer = null;
  bubble.style.position = "relative";
  const openReactionPicker = () => {
    const old = bubble.querySelector(".reaction-pop");
    if(old) { old.remove(); return; }
    const pop = document.createElement("div");
    pop.className = "reaction-pop";
    ["❤️","😂","👍","🔥","😮","😢"].forEach(emoji => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = emoji;
      b.onclick = (ev) => {
        ev.stopPropagation();
        localReactions.set(id, emoji);
        const oldBadge = bubble.querySelector(".local-reaction");
        if(oldBadge) oldBadge.remove();
        const badge = document.createElement("span");
        badge.className = "local-reaction absolute -bottom-3 right-2 bg-gray-900 border border-white/10 rounded-full px-1.5 py-0.5 text-[11px] shadow";
        badge.textContent = emoji;
        bubble.appendChild(badge);
        pop.remove();
      };
      pop.appendChild(b);
    });
    bubble.appendChild(pop);
  };
  bubble.addEventListener("dblclick", (ev) => { ev.stopPropagation(); openReactionPicker(); });
  bubble.addEventListener("touchstart", () => {
    clearTimeout(pressTimer);
    pressTimer = setTimeout(openReactionPicker, 550);
  }, {passive:true});
  bubble.addEventListener("touchend", () => clearTimeout(pressTimer), {passive:true});
  bubble.addEventListener("touchmove", () => clearTimeout(pressTimer), {passive:true});

  chatBox.insertBefore(row, scrollAnchor);

  if (nearBottom || isMe) {
    scrollToBottom();
  } else if (!isSystem) {
    unreadCount++;
    jumpCount.textContent = unreadCount + " pesan baru";
    jumpBtn.classList.remove("hidden");
    jumpBtn.classList.add("flex");
  }

  if (!isMe && !isSystem && soundOn) {
    const p = pop.play();
    if (p !== undefined) p.catch(() => {});
  }
}

/* Event delegation: handles reply + copy without ever building onclick="" from user text */
let unreadCount = 0;
chatBox.addEventListener("click", (e) => {
  const actionEl = e.target.closest("[data-action]");
  if (!actionEl) return;
  const row = e.target.closest(".msg-row");
  if (!row) return;
  const id = row.getAttribute("data-msg-id");
  const data = msgStore.get(id);
  if (!data) return;

  if (actionEl.dataset.action === "reply") {
    e.stopPropagation();
    setReply(data.sender, data.text);
  } else if (actionEl.dataset.action === "copy") {
    navigator.clipboard.writeText(data.text).then(() => sT("Pesan disalin!")).catch(() => {});
  }
});

window.sC = function(){
  scrollAnchor.scrollIntoView({ behavior: "smooth", block: "end" });
};
function scrollToBottom(){
  sC();
  unreadCount = 0;
  jumpBtn.classList.add("hidden");
  jumpBtn.classList.remove("flex");
}
jumpBtn.onclick = scrollToBottom;
chatBox.addEventListener("scroll", () => {
  const nearBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 40;
  if (nearBottom) { unreadCount = 0; jumpBtn.classList.add("hidden"); jumpBtn.classList.remove("flex"); }
});

/* ---------- In-page/browser notification ---------- */
let notificationReady = false;
function maybeRequestNotifications(){
  if("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission().then(p => { notificationReady = p === "granted"; }).catch(()=>{});
  } else if("Notification" in window) notificationReady = Notification.permission === "granted";
}
userNameBadge.addEventListener("click", maybeRequestNotifications, {capture:true});

/* ---------- Incoming messages ---------- */
if (messagesRef) {
  messagesRef.limitToLast(100).on("child_added", (snap) => {
    loadingMsg.classList.add("opacity-0", "pointer-events-none");
    const v = snap.val();
    if (v && (v.text || v.url)) {
      const sender = v.name || "Anon";
      const media = (v.type === "image" || v.type === "gift") ? {type:v.type, url:v.url || "", caption:v.caption || ""} : null;
      renderMessage(snap.key, sender, v.text || "", v.timestamp, false, media);
      if (document.hidden && sender !== myName && "Notification" in window && Notification.permission === "granted") {
        try { new Notification(sender, { body: media ? (media.type === "gift" ? "🎁 Mengirim gift" : "🖼️ Mengirim gambar") : v.text.replace(/\s+/g," ").slice(0,120), icon: avatarUrl(sender) }); } catch(e) {}
      }
    }
  }, () => {
    sT("Database Dikunci!");
    loadingMsg.innerHTML = "<i class='fa-solid fa-triangle-exclamation text-red-500 text-3xl mb-3'></i> <span class='text-red-400 font-bold'>Akses Ditolak</span>";
    loadingMsg.classList.remove("opacity-0", "pointer-events-none");
  });
}

/* ---------- Keyboard shortcuts ---------- */
messageInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") {
    e.preventDefault();
    if(!sendBtn.disabled) messageForm.requestSubmit();
  }
});

/* ---------- Profanity filter ---------- */
const BAD_WORDS = ["anjing","babi","monyet","bangsat","kontol","memek","ngentot","goblok","tolol","fuck","shit","bitch","nigga","sex","porn","jancok","dancok","asu","bajingan","kampret","ngehe","titit","pantat","ngewe","pepek","peler","puki","sundala","telaso","gendeng","edan","bgst","gblk","dick","pussy","cock","boobs","tits","lonte","pelacur","jablay","s3x","fck","njing","bgsd","kntl"];
function censor(text){
  let out = text;
  BAD_WORDS.forEach(w => { out = out.replace(new RegExp(w, "gi"), "***"); });
  return out;
}

/* ---------- Image / Gift sending ---------- */
function openMedia(mode){
  mediaModal.classList.add("show"); mediaModal.setAttribute("aria-hidden","false");
  const isGift = mode === "gift";
  mediaTitle.textContent = isGift ? "Kirim gift" : "Kirim gambar";
  imagePanel.classList.toggle("hidden", isGift);
  giftPanel.classList.toggle("hidden", !isGift);
  if (!isGift) { imageUrlInput.value = ""; imagePreviewWrap.classList.add("hidden"); setTimeout(()=>imageUrlInput.focus(),50); }
}
function closeMedia(){ mediaModal.classList.remove("show"); mediaModal.setAttribute("aria-hidden","true"); }
mediaClose.onclick = closeMedia;
mediaModal.addEventListener("click", e => { if(e.target === mediaModal) closeMedia(); });
imageBtn.onclick = () => openMedia("image");
giftBtn.onclick = () => openMedia("gift");
imageUrlInput.addEventListener("input", () => {
  const url = safeUrl(imageUrlInput.value.trim());
  if(url){ imagePreview.src=url; imagePreviewWrap.classList.remove("hidden"); }
  else imagePreviewWrap.classList.add("hidden");
});
imagePreview.onerror = () => imagePreviewWrap.classList.add("hidden");
function sendMedia(type, url, caption=""){
  if(!firebase.auth().currentUser || !messagesRef) return sT("Belum terhubung.");
  const clean = safeUrl(url);
  if(!clean || clean.length > 500) return sT("Link tidak valid.");
  if(Date.now() - lastSend < 1000) return sT("Tunggu 1 detik.");
  const payload = { type, url: clean, caption: String(caption || "").slice(0,60), text: type === "gift" ? "🎁 Gift" : "🖼️ Gambar", name: myName, uid: firebase.auth().currentUser.uid, timestamp: firebase.database.ServerValue.TIMESTAMP };
  messagesRef.push(payload).then(()=>{ lastSend=Date.now(); closeMedia(); }).catch(()=>sT("Gagal kirim media!"));
}
imageSendBtn.onclick = () => sendMedia("image", imageUrlInput.value.trim(), "Gambar");
const GIFTS = [
  ["🎁","Hadiah","https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f381.svg"],
  ["🌹","Mawar","https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f339.svg"],
  ["💎","Berlian","https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f48e.svg"],
  ["❤️","Cinta","https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/2764.svg"],
  ["🎂","Kue","https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f382.svg"],
  ["🧸","Boneka","https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f9f8.svg"],
  ["🏆","Trofi","https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f3c6.svg"],
  ["⭐","Bintang","https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/2b50.svg"]
];
GIFTS.forEach(([emoji,name,url])=>{
  const b=document.createElement("button"); b.type="button"; b.className="gift-item"; b.innerHTML=`<img src="${url}" alt="${name}"><div class="text-[10px] mt-1">${emoji} ${name}</div>`;
  b.onclick=()=>sendMedia("gift",url,name); giftGrid.appendChild(b);
});

/* ---------- Sending ---------- */
let lastSend = 0;
updateCharCount();
messageForm.onsubmit = (e) => {
  e.preventDefault();
  let text = messageInput.value.trim();
  if (text.length === 0) return;
  if (Date.now() - lastSend < 1000) { sT("Tunggu 1 detik."); return; }

  text = censor(text);

  if (replyState) {
    const snippet = replyState.m.length > 30 ? replyState.m.substring(0, 30) + "..." : replyState.m;
    text = "\n> " + replyState.n + " | " + snippet + "\n" + text;
    replyState = null;
    replyBox.classList.add("hidden");
  }

  const payload = { type: "text", name: myName, uid: firebase.auth().currentUser.uid, text, timestamp: firebase.database.ServerValue.TIMESTAMP };
  messageInput.value = "";
  try { localStorage.removeItem("tchat_draft"); } catch(e) {}
  updateCharCount();
  sendBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';

  messagesRef.push(payload)
    .then(() => { lastSend = Date.now(); })
    .catch(() => sT("Gagal kirim pesan!"))
    .finally(() => {
      sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane ml-[-2px] text-lg"></i>';
      messageInput.focus();
    });
};

/* ---------- V5 GitHub Pages / mobile optimizations ---------- */
// Only the latest 100 messages are read/rendered. Old messages remain in Firebase
// until server-side cleanup is configured. The browser is never granted delete access.
const V5_CONFIG = Object.freeze({
  maxLoadedMessages: 100,
  messageMaxLength: 130,
  mediaUrlMaxLength: 500,
  githubPagesReady: true
});
try { localStorage.setItem("tchat_v5", "github-pages"); } catch(e) {}

/* ---------- Welcome system message (local only, no DB write) ---------- */
setTimeout(() => {
  renderMessage(
    "local-welcome-" + Date.now(),
    "⚙️ Sistem",
    "Selamat datang di TChat 👋\n\nFitur yang tersedia:\n- Indikator sedang mengetik\n- Pencarian pesan\n- Jumlah pengguna online\n- Tombol lompat ke pesan terbaru",
    Date.now(),
    true
  );
}, 1000);

})();
