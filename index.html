<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TChat</title>
<script>
/* Auto cache-buster: detects a newer deployed version and force-reloads without
   requiring the user to manually refresh. Bump BUILD_ID on every deploy. */
(function(){
  var BUILD_ID = "2026-09-23-r1";
  try {
    if (sessionStorage.getItem("tchat_no_redirect")) return;
    fetch(location.pathname, { cache: "no-store" })
      .then(function(r){ return r.text(); })
      .then(function(html){
        var m = html.match(/BUILD_ID\s*=\s*"([^"]+)"/);
        if (m && m[1] && m[1] !== BUILD_ID) {
          sessionStorage.setItem("tchat_no_redirect", "1");
          location.replace(location.pathname + "?v=" + Date.now());
        }
      })
      .catch(function(){});
  } catch(e) {}
})();
</script>

<style>
:root{--thm-bg1:#3b82f6;--thm-bg2:#2563eb}
body{font-family:'Inter',sans-serif;overscroll-behavior-y:none;background:radial-gradient(120% 100% at 50% 0%,#151b28 0%,#0b0e14 55%,#08090d 100%)}
*{-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none}
.msg-enter{animation:popIn .3s cubic-bezier(0.175,0.885,0.32,1.275) forwards;opacity:0;transform-origin:bottom center}
@keyframes popIn{0%{opacity:0;transform:translateY(15px) scale(0.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.bubble-me{background:linear-gradient(135deg,var(--thm-bg1) 0%,var(--thm-bg2) 100%);box-shadow:0 6px 16px -6px rgba(0,0,0,0.35)}
.glass-header{background:rgba(13,16,24,0.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,0.06)}
.glass-footer{background:rgba(13,16,24,0.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,0.06)}
.theme-icon{background:linear-gradient(135deg,var(--thm-bg1),var(--thm-bg2))}
.hid-scroll::-webkit-scrollbar{display:none}
#jumpBtn{transition:all .25s cubic-bezier(0.175,0.885,0.32,1.275)}
.icon-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.05)}
.icon-btn:hover{background:rgba(255,255,255,0.08)}
.bubble-other{background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.06)}
.emj-btn{background:rgba(255,255,255,0.035);border-radius:9999px;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.emj-btn:hover{background:rgba(255,255,255,0.08)}
</style>
</head>
<body class="text-white flex flex-col h-[100dvh] overflow-hidden" oncontextmenu="return false">

<header class="glass-header px-4 py-3 flex-none flex items-center justify-between z-20 w-full">
  <div class="flex items-center gap-2.5">
    <div class="relative">
      <div id="mainIcon" class="theme-icon w-9 h-9 rounded-full flex items-center justify-center shadow-lg transition-all duration-300">
        <i class="fa-solid fa-paper-plane text-white text-[13px] -rotate-45"></i>
      </div>
      <div id="statusDot" class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-red-500 border-2 border-[#0d1018] rounded-full transition-colors duration-500"></div>
    </div>
    <div class="flex flex-col justify-center flex-shrink-0">
      <h1 class="font-bold text-[15px] sm:text-[16px] leading-tight tracking-tight text-gray-100">TChat</h1>
      <span id="statusText" class="text-[10px] font-medium text-gray-500 mt-0.5">Menghubungkan...</span>
    </div>
  </div>
  <div class="flex items-center gap-1.5 overflow-x-auto hid-scroll">
    <button id="searchBtn" class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-white transition-colors text-sm flex-shrink-0" title="Cari Pesan"><i class="fa-solid fa-search"></i></button>
    <button id="clrBtn" class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-red-400 transition-colors text-sm flex-shrink-0" title="Bersihkan tampilan (lokal saja)"><i class="fa-solid fa-broom"></i></button>
    <button id="sndBtn" class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-white transition-colors text-sm flex-shrink-0" title="Suara"><i class="fa-solid fa-volume-high"></i></button>
    <button id="themeBtn" class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-white transition-colors text-sm flex-shrink-0" title="Tema"><i class="fa-solid fa-palette"></i></button>
    <div id="userNameBadge" class="icon-btn px-2.5 py-1.5 rounded-full text-xs font-semibold text-gray-200 hidden backdrop-blur-md flex items-center gap-2 cursor-pointer hover:bg-white/10 transition-colors flex-shrink-0" title="Tap ganti nama">
      <img id="myAvatar" src="" class="w-6 h-6 rounded-full bg-gray-700">
      <span id="myNameTxt" class="hidden sm:inline"></span>
    </div>
  </div>
</header>

<div id="searchBox" class="hidden bg-gray-900 border-b border-gray-800 px-4 py-2 flex items-center gap-2 z-10">
  <input type="text" id="searchInput" class="w-full bg-gray-800 text-sm px-3 py-1.5 rounded-lg border border-gray-700 text-white outline-none focus:border-blue-500" placeholder="Cari pesan di layar...">
  <button id="closeSearch" class="text-gray-400 hover:text-white px-2"><i class="fa-solid fa-times"></i></button>
</div>

<main id="chatBox" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 scroll-smooth relative z-0 hid-scroll">
  <div id="loadingMsg" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 text-sm z-10 bg-[#0b0e14]/90 backdrop-blur-sm transition-opacity duration-300">
    <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3" style="color:var(--thm-bg1)"></i>
    <span>Memuat percakapan...</span>
  </div>
  <div id="scrollAnchor" class="h-2 w-full flex-shrink-0"></div>
</main>

<!-- Jump-to-bottom / unread messages button -->
<button id="jumpBtn" class="hidden absolute bottom-[128px] right-4 z-20 theme-icon text-white text-xs font-bold rounded-full px-4 py-2.5 shadow-xl items-center gap-2">
  <i class="fa-solid fa-arrow-down"></i>
  <span id="jumpCount">Pesan baru</span>
</button>

<footer class="glass-footer flex-none w-full p-2 pb-safe z-20 relative">
  <div id="toast" class="absolute -top-16 left-1/2 transform -translate-x-1/2 bg-red-500/95 backdrop-blur-sm text-white px-5 py-2 rounded-full shadow-xl text-xs font-bold transition-all duration-300 opacity-0 translate-y-2 pointer-events-none">Error</div>

  <div id="replyBox" class="hidden mx-auto max-w-4xl px-2 mb-2">
    <div class="bg-white/[0.06] rounded-xl px-3 py-1.5 flex justify-between items-center border border-white/10 border-l-4 border-l-[var(--thm-bg1)]">
      <span id="replyTxt" class="text-[11px] text-gray-300 truncate mr-2 font-medium">Membalas...</span>
      <button id="closeReply" class="text-gray-400 hover:text-white bg-white/10 rounded-full w-5 h-5 flex items-center justify-center"><i class="fa-solid fa-times text-[10px]"></i></button>
    </div>
  </div>

  <div class="flex gap-2 overflow-x-auto pb-2 px-1 hid-scroll mb-1 items-center justify-between">
    <div class="flex gap-1.5 items-center">
      <button class="emj-btn text-base">😂</button>
      <button class="emj-btn text-base">❤️</button>
      <button class="emj-btn text-base">🔥</button>
      <button class="emj-btn text-base">👍</button>
      <button class="emj-btn text-base">🗿</button>
      <button class="emj-btn text-base">💀</button>
      <button class="emj-btn text-base">😎</button>
    </div>
    <div id="typingIndicator" class="text-[10px] text-[var(--thm-bg1)] italic hidden animate-pulse whitespace-nowrap">Seseorang sedang mengetik...</div>
  </div>

  <form id="messageForm" class="flex items-end gap-2 max-w-4xl mx-auto px-1">
    <div class="flex-1 bg-white/[0.04] border border-white/10 rounded-3xl flex items-center px-4 py-1 transition-all focus-within:border-[var(--thm-bg1)]/60 relative">
      <input type="text" id="messageInput" class="w-full bg-transparent border-none focus:ring-0 text-gray-100 py-2.5 text-[15px] placeholder-gray-500 outline-none pr-9" placeholder="Ketik pesan..." autocomplete="off" maxlength="130" required disabled>
      <span id="charCount" class="absolute right-3 bottom-1.5 text-[9px] text-gray-600 font-mono pointer-events-none">0/130</span>
    </div>
    <button type="submit" id="sendBtn" class="theme-icon active:scale-90 text-white rounded-full w-12 h-12 flex items-center justify-center transition-all disabled:opacity-50 disabled:active:scale-100 shadow-lg flex-shrink-0" disabled>
      <i class="fa-solid fa-paper-plane ml-[-2px] text-lg"></i>
    </button>
  </form>
</footer>
