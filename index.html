<!DOCTYPE html>

<html class="antialiased" lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" name="viewport"/>
<meta content="#111827" name="theme-color"/>
<meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
<meta content="no-cache" http-equiv="Pragma"/>
<meta content="0" http-equiv="Expires"/>
<title>TChat</title>

<link href="https://cdn.tailwindcss.com" rel="preconnect"/>
<link href="https://www.gstatic.com" rel="preconnect"/>
<link href="https://api.dicebear.com" rel="preconnect"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{--thm-bg1:#3b82f6;--thm-bg2:#2563eb}
body{font-family:'Inter',sans-serif;overscroll-behavior-y:none;background:radial-gradient(120% 100% at 50% 0%,#151b28 0%,#0b0e14 55%,#08090d 100%)}
*{-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none}
.msg-enter{animation:popIn .3s cubic-bezier(0.175,0.885,0.32,1.275) forwards;opacity:0;transform-origin:bottom center}
@keyframes popIn{0%{opacity:0;transform:translateY(15px) scale(0.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.bubble-me{background:linear-gradient(135deg,var(--thm-bg1) 0%,var(--thm-bg2) 100%);box-shadow:0 6px 16px -6px rgba(0,0,0,0.35)}
.glass-header{background:rgba(13,16,24,0.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,0.06)}
.glass-footer{background:rgba(13,16,24,0.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,0.06)}
.theme-icon{background:linear-gradient(135deg,var(--thm-bg1),var(--thm-bg2))}
.hid-scroll::-webkit-scrollbar{display:none}
#jumpBtn{transition:all .25s cubic-bezier(0.175,0.885,0.32,1.275)}
.icon-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.05)}
.icon-btn:hover{background:rgba(255,255,255,0.08)}
.bubble-other{background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.06)}
.emj-btn{background:rgba(255,255,255,0.035);border-radius:9999px;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.emj-btn:hover{background:rgba(255,255,255,0.08)}
</style>
</head>
<body class="text-white flex flex-col h-[100dvh] overflow-hidden" oncontextmenu="return false">
<header class="glass-header px-4 py-3 flex-none flex items-center justify-between z-20 w-full">
<div class="flex items-center gap-2.5">
<div class="relative">
<div class="theme-icon w-9 h-9 rounded-full flex items-center justify-center shadow-lg transition-all duration-300" id="mainIcon">
<i class="fa-solid fa-paper-plane text-white text-[13px] -rotate-45"></i>
</div>
<div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-red-500 border-2 border-[#0d1018] rounded-full transition-colors duration-500" id="statusDot"></div>
</div>
<div class="flex flex-col justify-center flex-shrink-0">
<h1 class="font-bold text-[15px] sm:text-[16px] leading-tight tracking-tight text-gray-100">TChat</h1>
<span class="text-[10px] font-medium text-gray-500 mt-0.5" id="statusText">Menghubungkan...</span>
</div>
</div>
<div class="flex items-center gap-1.5 overflow-x-auto hid-scroll">
<button class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-white transition-colors text-sm flex-shrink-0" id="searchBtn" title="Cari Pesan"><i class="fa-solid fa-search"></i></button>
<button class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-red-400 transition-colors text-sm flex-shrink-0" id="clrBtn" title="Bersihkan tampilan (lokal saja)"><i class="fa-solid fa-broom"></i></button>
<button class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-white transition-colors text-sm flex-shrink-0" id="sndBtn" title="Suara"><i class="fa-solid fa-volume-high"></i></button>
<button class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-white transition-colors text-sm flex-shrink-0" id="themeBtn" title="Tema"><i class="fa-solid fa-palette"></i></button>
<div class="icon-btn px-2.5 py-1.5 rounded-full text-xs font-semibold text-gray-200 hidden backdrop-blur-md flex items-center gap-2 cursor-pointer hover:bg-white/10 transition-colors flex-shrink-0" id="userNameBadge" title="Tap ganti nama">
<img class="w-6 h-6 rounded-full bg-gray-700" id="myAvatar" src=""/>
<span class="hidden sm:inline" id="myNameTxt"></span>
</div>
</div>
</header>
<div class="hidden bg-gray-900 border-b border-gray-800 px-4 py-2 flex items-center gap-2 z-10" id="searchBox">
<input class="w-full bg-gray-800 text-sm px-3 py-1.5 rounded-lg border border-gray-700 text-white outline-none focus:border-blue-500" id="searchInput" placeholder="Cari pesan di layar..." type="text"/>
<button class="text-gray-400 hover:text-white px-2" id="closeSearch"><i class="fa-solid fa-times"></i></button>
</div>
<main class="flex-1 overflow-y-auto px-4 py-4 space-y-4 scroll-smooth relative z-0 hid-scroll" id="chatBox">
<div class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 text-sm z-10 bg-[#0b0e14]/90 backdrop-blur-sm transition-opacity duration-300" id="loadingMsg">
<i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3" style="color:var(--thm-bg1)"></i>
<span>Memuat percakapan...</span>
</div>
<div class="h-2 w-full flex-shrink-0" id="scrollAnchor"></div>
</main>
<!-- Jump-to-bottom / unread messages button -->
<button class="hidden absolute bottom-[128px] right-4 z-20 theme-icon text-white text-xs font-bold rounded-full px-4 py-2.5 shadow-xl items-center gap-2" id="jumpBtn">
<i class="fa-solid fa-arrow-down"></i>
<span id="jumpCount">Pesan baru</span>
</button>
<footer class="glass-footer flex-none w-full p-2 pb-safe z-20 relative">
<div class="absolute -top-16 left-1/2 transform -translate-x-1/2 bg-red-500/95 backdrop-blur-sm text-white px-5 py-2 rounded-full shadow-xl text-xs font-bold transition-all duration-300 opacity-0 translate-y-2 pointer-events-none" id="toast">Error</div>
<div class="hidden mx-auto max-w-4xl px-2 mb-2" id="replyBox">
<div class="bg-white/[0.06] rounded-xl px-3 py-1.5 flex justify-between items-center border border-white/10 border-l-4 border-l-[var(--thm-bg1)]">
<span class="text-[11px] text-gray-300 truncate mr-2 font-medium" id="replyTxt">Membalas...</span>
<button class="text-gray-400 hover:text-white bg-white/10 rounded-full w-5 h-5 flex items-center justify-center" id="closeReply"><i class="fa-solid fa-times text-[10px]"></i></button>
</div>
</div>
<div class="flex gap-2 overflow-x-auto pb-2 px-1 hid-scroll mb-1 items-center justify-between">
<div class="flex gap-1.5 items-center">
<button class="emj-btn text-base">😂</button>
<button class="emj-btn text-base">❤️</button>
<button class="emj-btn text-base">🔥</button>
<button class="emj-btn text-base">👍</button>
<button class="emj-btn text-base">🗿</button>
<button class="emj-btn text-base">💀</button>
<button class="emj-btn text-base">😎</button>
</div>
<div class="text-[10px] text-[var(--thm-bg1)] italic hidden animate-pulse whitespace-nowrap" id="typingIndicator">Seseorang sedang mengetik...</div>
</div>
<form class="flex items-end gap-2 max-w-4xl mx-auto px-1" id="messageForm">
<div class="flex-1 bg-white/[0.04] border border-white/10 rounded-3xl flex items-center px-4 py-1 transition-all focus-within:border-[var(--thm-bg1)]/60 relative">
<input autocomplete="off" class="w-full bg-transparent border-none focus:ring-0 text-gray-100 py-2.5 text-[15px] placeholder-gray-500 outline-none pr-9" disabled="" id="messageInput" maxlength="130" placeholder="Ketik pesan..." required="" type="text"/>
<span class="absolute right-3 bottom-1.5 text-[9px] text-gray-600 font-mono pointer-events-none" id="charCount">0/130</span>
</div>
<button class="theme-icon active:scale-90 text-white rounded-full w-12 h-12 flex items-center justify-center transition-all disabled:opacity-50 disabled:active:scale-100 shadow-lg flex-shrink-0" disabled="" id="sendBtn" type="submit">
<i class="fa-solid fa-paper-plane ml-[-2px] text-lg"></i>
</button>
</form>
</footer>
