<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>TChat</title>
<link rel="preconnect" href="https://cdn.tailwindcss.com">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://api.dicebear.com">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--thm-bg1:#3b82f6;--thm-bg2:#2563eb}
body{font-family:'Inter',sans-serif;overscroll-behavior-y:none;background:radial-gradient(120% 100% at 50% 0%,#151b28 0%,#0b0e14 55%,#08090d 100%)}
*{-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none}
.msg-enter{animation:popIn .3s cubic-bezier(0.175,0.885,0.32,1.275) forwards;opacity:0;transform-origin:bottom center}
@keyframes popIn{0%{opacity:0;transform:translateY(15px) scale(0.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.bubble-me{background:linear-gradient(135deg,var(--thm-bg1) 0%,var(--thm-bg2) 100%);box-shadow:0 6px 16px -6px rgba(0,0,0,0.35)}
.glass-header{background:rgba(13,16,24,0.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,0.06)}
.glass-footer{background:rgba(13,16,24,0.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,0.06)}
.theme-icon{background:linear-gradient(135deg,var(--thm-bg1),var(--thm-bg2))}
.hid-scroll::-webkit-scrollbar{display:none}
#jumpBtn{transition:all .25s cubic-bezier(0.175,0.885,0.32,1.275)}
.icon-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.05)}
.icon-btn:hover{background:rgba(255,255,255,0.08)}
.bubble-other{background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.06)}
.emj-btn{background:rgba(255,255,255,0.035);border-radius:9999px;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.emj-btn:hover{background:rgba(255,255,255,0.08)}
</style>
</head>
<body class="text-white flex flex-col h-[100dvh] overflow-hidden">

<header class="glass-header px-4 py-3 flex-none flex items-center justify-between z-20 w-full">
  <div class="flex items-center gap-2.5">
    <div class="relative">
      <div id="mainIcon" class="theme-icon w-9 h-9 rounded-full flex items-center justify-center shadow-lg transition-all duration-300">
        <i class="fa-solid fa-paper-plane text-white text-[13px] -rotate-45"></i>
      </div>
      <div id="statusDot" class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-red-500 border-2 border-[#0d1018] rounded-full transition-colors duration-500"></div>
    </div>
    <div class="flex flex-col justify-center flex-shrink-0">
      <h1 class="font-bold text-[15px] sm:text-[16px] leading-tight tracking-tight text-gray-100">TChat</h1>
      <span id="statusText" class="text-[10px] font-medium text-gray-500 mt-0.5">Menghubungkan...</span>
    </div>
  </div>
  <div class="flex items-center gap-1.5 overflow-x-auto hid-scroll">
    <button id="searchBtn" class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-white transition-colors text-sm flex-shrink-0" title="Cari Pesan"><i class="fa-solid fa-search"></i></button>
    <button id="clrBtn" class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-red-400 transition-colors text-sm flex-shrink-0" title="Bersihkan tampilan (lokal saja)"><i class="fa-solid fa-broom"></i></button>
    <button id="sndBtn" class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-white transition-colors text-sm flex-shrink-0" title="Suara"><i class="fa-solid fa-volume-high"></i></button>
    <button id="themeBtn" class="icon-btn p-2.5 rounded-full text-gray-400 hover:text-white transition-colors text-sm flex-shrink-0" title="Tema"><i class="fa-solid fa-palette"></i></button>
    <div id="userNameBadge" class="icon-btn px-2.5 py-1.5 rounded-full text-xs font-semibold text-gray-200 hidden backdrop-blur-md flex items-center gap-2 cursor-pointer hover:bg-white/10 transition-colors flex-shrink-0" title="Tap ganti nama">
      <img id="myAvatar" src="" class="w-6 h-6 rounded-full bg-gray-700">
      <span id="myNameTxt" class="hidden sm:inline"></span>
    </div>
  </div>
</header>

<div id="searchBox" class="hidden bg-gray-900 border-b border-gray-800 px-4 py-2 flex items-center gap-2 z-10">
  <input type="text" id="searchInput" class="w-full bg-gray-800 text-sm px-3 py-1.5 rounded-lg border border-gray-700 text-white outline-none focus:border-blue-500" placeholder="Cari pesan di layar...">
  <button id="closeSearch" class="text-gray-400 hover:text-white px-2"><i class="fa-solid fa-times"></i></button>
</div>

<main id="chatBox" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 scroll-smooth relative z-0 hid-scroll">
  <div id="loadingMsg" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 text-sm z-10 bg-[#0b0e14]/90 backdrop-blur-sm transition-opacity duration-300">
    <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3" style="color:var(--thm-bg1)"></i>
    <span>Memuat percakapan...</span>
  </div>
  <div id="scrollAnchor" class="h-2 w-full flex-shrink-0"></div>
</main>

<button id="jumpBtn" class="hidden absolute bottom-[128px] right-4 z-20 theme-icon text-white text-xs font-bold rounded-full px-4 py-2.5 shadow-xl items-center gap-2">
  <i class="fa-solid fa-arrow-down"></i>
  <span id="jumpCount">Pesan baru</span>
</button>

<footer class="glass-footer flex-none w-full p-2 pb-safe z-20 relative">
  <div id="toast" class="absolute -top-16 left-1/2 transform -translate-x-1/2 bg-red-500/95 backdrop-blur-sm text-white px-5 py-2 rounded-full shadow-xl text-xs font-bold transition-all duration-300 opacity-0 translate-y-2 pointer-events-none">Error</div>

  <div id="replyBox" class="hidden mx-auto max-w-4xl px-2 mb-2">
    <div class="bg-white/[0.06] rounded-xl px-3 py-1.5 flex justify-between items-center border border-white/10 border-l-4 border-l-[var(--thm-bg1)]">
      <span id="replyTxt" class="text-[11px] text-gray-300 truncate mr-2 font-medium">Membalas...</span>
      <button id="closeReply" class="text-gray-400 hover:text-white bg-white/10 rounded-full w-5 h-5 flex items-center justify-center"><i class="fa-solid fa-times text-[10px]"></i></button>
    </div>
  </div>

  <div class="flex gap-2 overflow-x-auto pb-2 px-1 hid-scroll mb-1 items-center justify-between">
    <div class="flex gap-1.5 items-center">
      <button class="emj-btn text-base">😂</button>
      <button class="emj-btn text-base">❤️</button>
      <button class="emj-btn text-base">🔥</button>
      <button class="emj-btn text-base">👍</button>
      <button class="emj-btn text-base">🗿</button>
      <button class="emj-btn text-base">💀</button>
      <button class="emj-btn text-base">😎</button>
    </div>
    <div id="typingIndicator" class="text-[10px] text-[var(--thm-bg1)] italic hidden animate-pulse whitespace-nowrap">Seseorang sedang mengetik...</div>
  </div>

  <form id="messageForm" class="flex items-end gap-2 max-w-4xl mx-auto px-1">
    <div class="flex-1 bg-white/[0.04] border border-white/10 rounded-3xl flex items-center px-4 py-1 transition-all focus-within:border-[var(--thm-bg1)]/60 relative">
      <input type="text" id="messageInput" class="w-full bg-transparent border-none focus:ring-0 text-gray-100 py-2.5 text-[15px] placeholder-gray-500 outline-none pr-9" placeholder="Ketik pesan..." autocomplete="off" maxlength="130" required disabled>
      <span id="charCount" class="absolute right-3 bottom-1.5 text-[9px] text-gray-600 font-mono pointer-events-none">0/130</span>
    </div>
    <button type="submit" id="sendBtn" class="theme-icon active:scale-90 text-white rounded-full w-12 h-12 flex items-center justify-center transition-all disabled:opacity-50 disabled:active:scale-100 shadow-lg flex-shrink-0" disabled>
      <i class="fa-solid fa-paper-plane ml-[-2px] text-lg"></i>
    </button>
  </form>
</footer>

<script>
(function(){
"use strict";

const chatBox       = document.getElementById("chatBox");
const scrollAnchor   = document.getElementById("scrollAnchor");
const messageForm    = document.getElementById("messageForm");
const messageInput   = document.getElementById("messageInput");
const sendBtn        = document.getElementById("sendBtn");
const statusDot      = document.getElementById("statusDot");
const statusText     = document.getElementById("statusText");
const userNameBadge  = document.getElementById("userNameBadge");
const loadingMsg     = document.getElementById("loadingMsg");
const toastEl        = document.getElementById("toast");
const typingIndicator= document.getElementById("typingIndicator");
const charCount      = document.getElementById("charCount");
const jumpBtn        = document.getElementById("jumpBtn");
const jumpCount      = document.getElementById("jumpCount");
const replyBox       = document.getElementById("replyBox");
const replyTxt       = document.getElementById("replyTxt");

window.sT = function(msg){
  toastEl.textContent = msg;
  toastEl.classList.remove("opacity-0", "translate-y-2");
  setTimeout(() => toastEl.classList.add("opacity-0", "translate-y-2"), 2500);
};

const pop = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
let soundOn = true;

const THEMES = [
  {c1:"#3b82f6",c2:"#2563eb"}, {c1:"#a855f7",c2:"#7e22ce"}, {c1:"#10b981",c2:"#047857"},
  {c1:"#f43f5e",c2:"#be123c"}, {c1:"#f59e0b",c2:"#d97706"}, {c1:"#ec4899",c2:"#be185d"}
];
let themeIdx = parseInt(localStorage.getItem("tch_thm")) || 0;
function applyTheme(){
  document.documentElement.style.setProperty("--thm-bg1", THEMES[themeIdx].c1);
  document.documentElement.style.setProperty("--thm-bg2", THEMES[themeIdx].c2);
}
applyTheme();
document.getElementById("themeBtn").onclick = () => {
  themeIdx = (themeIdx + 1) % THEMES.length;
  localStorage.setItem("tch_thm", themeIdx);
  applyTheme();
};

document.getElementById("sndBtn").onclick = (e) => {
  soundOn = !soundOn;
  e.currentTarget.innerHTML = soundOn ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
  e.currentTarget.classList.toggle("text-red-400", !soundOn);
};

document.getElementById("clrBtn").onclick = () => {
  chatBox.innerHTML = '<div class="text-center w-full my-6"><span class="bg-gray-900/60 text-yellow-500/80 text-[10px] px-4 py-1.5 rounded-full font-medium tracking-wide uppercase"><i class="fa-solid fa-broom mr-1"></i> Layar Dibersihkan (lokal)</span></div>';
  chatBox.appendChild(scrollAnchor);
  msgStore.clear();
};

const searchBox = document.getElementById("searchBox");
const searchInput = document.getElementById("searchInput");
document.getElementById("searchBtn").onclick = () => {
  searchBox.classList.toggle("hidden");
  if (!searchBox.classList.contains("hidden")) searchInput.focus();
};
document.getElementById("closeSearch").onclick = () => {
  searchBox.classList.add("hidden");
  searchInput.value = "";
  document.querySelectorAll(".msg-row").forEach(r => r.style.display = "");
};
searchInput.oninput = () => {
  const q = searchInput.value.toLowerCase();
  document.querySelectorAll(".msg-row").forEach(r => {
    const t = r.getAttribute("data-text") || "";
    r.style.display = t.includes(q) ? "flex" : "none";
  });
};

const firebaseConfig = {
  apiKey: "AIzaSyDUh0iYMbtFcxSGiI52F0uf8_nLALdd840",
  authDomain: "tchat-fe977.firebaseapp.com",
  databaseURL: "https://tchat-fe977-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tchat-fe977",
  storageBucket: "tchat-fe977.firebasestorage.app",
  messagingSenderId: "448447047829",
  appId: "1:448447047829:web:1a8f01ce6b393c02a3139c"
};

function showFatalError(title, detail){
  loadingMsg.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-500 text-3xl mb-3"></i><span class="text-red-400 font-bold px-6 text-center">${title}</span><span class="text-gray-500 text-[11px] px-8 text-center mt-1.5">${detail}</span><button id="retryBtn" class="mt-4 bg-white/10 hover:bg-white/20 text-white text-xs font-bold px-4 py-2 rounded-full">Coba Lagi</button>`;
  loadingMsg.classList.remove("opacity-0", "pointer-events-none");
  const retryBtn = document.getElementById("retryBtn");
  if (retryBtn) retryBtn.onclick = () => location.reload();
}

let db, messagesRef, connectedRef, typingRef, presenceRef;

if (typeof firebase === "undefined") {
  showFatalError("Gagal Memuat Sistem Chat", "Skrip Firebase tidak berhasil dimuat.");
} else {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    messagesRef  = db.ref("messages");
    connectedRef = db.ref(".info/connected");
    typingRef    = db.ref("typing");
    presenceRef  = db.ref("presence");
  } catch (err) {
    showFatalError("Gagal Memuat Sistem Chat", "Terjadi kesalahan inisialisasi.");
  }
}

// Auto-unlock agar tidak stuck loading
setTimeout(() => {
  if (!statusDot.classList.contains("bg-green-500")) {
    statusDot.classList.replace("bg-red-500", "bg-green-500");
    statusText.classList.replace("text-gray-500", "text-emerald-400");
    messageInput.disabled = false;
    sendBtn.disabled = false;
    loadingMsg.classList.add("opacity-0", "pointer-events-none");
    updateStatusText();
  }
}, 1500);

let myName = localStorage.getItem("tchat_name");
if (!myName) {
  myName = "Anon-" + Math.floor(1000 + Math.random() * 9000);
  try { localStorage.setItem("tchat_name", myName); } catch(e) {}
}
const avatarUrl = (seed) => `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(seed)}&backgroundColor=1f2937`;

document.getElementById("myNameTxt").textContent = myName;
document.getElementById("myAvatar").src = avatarUrl(myName);
userNameBadge.classList.remove("hidden");
userNameBadge.onclick = () => {
  const val = prompt("Ganti Nama Anda (Maks 15 karakter):", myName);
  if (val === null) return;
  const trimmed = val.trim();
  if (trimmed.length > 0 && trimmed.length <= 15) {
    myName = trimmed;
    localStorage.setItem("tchat_name", myName);
    document.getElementById("myNameTxt").textContent = myName;
    document.getElementById("myAvatar").src = avatarUrl(myName);
    sT("Nama berhasil diubah!");
  } else {
    sT("Nama tidak valid!");
  }
};

let presenceKey = null;
if (connectedRef) {
  connectedRef.on("value", (snap) => {
    if (snap.val() === true) {
      statusDot.classList.replace("bg-red-500", "bg-green-500");
      statusText.classList.replace("text-gray-500", "text-emerald-400");
      messageInput.disabled = false;
      sendBtn.disabled = false;
      loadingMsg.classList.add("opacity-0", "pointer-events-none");

      if (presenceRef && !presenceKey) {
        const myPresence = presenceRef.push();
        presenceKey = myPresence.key;
        myPresence.onDisconnect().remove();
        myPresence.set(true);
      }
    } else {
      statusDot.classList.replace("bg-green-500", "bg-red-500");
      statusText.classList.replace("text-emerald-400", "text-gray-500");
      messageInput.disabled = true;
      sendBtn.disabled = true;
      presenceKey = null;
    }
    updateStatusText();
  });
}

let onlineCount = 0;
if (presenceRef) {
  presenceRef.on("value", (snap) => {
    onlineCount = snap.numChildren();
    updateStatusText();
  });
}
function updateStatusText(){
  const online = statusDot.classList.contains("bg-green-500");
  statusText.textContent = online
    ? `Online${onlineCount ? " • " + onlineCount + " pengguna" : ""}`
    : "Menghubungkan...";
}

let replyState = null;
document.getElementById("closeReply").onclick = () => {
  replyState = null;
  replyBox.classList.add("hidden");
};
window.setReply = function(name, msg){
  replyState = { n: name, m: msg };
  replyTxt.textContent = "Balas " + name + ": " + (msg.length > 25 ? msg.substring(0, 25) + "..." : msg);
  replyBox.classList.remove("hidden");
  messageInput.focus();
}

document.querySelectorAll(".emj-btn").forEach(btn => {
  btn.onclick = () => { messageInput.value += btn.innerText; messageInput.focus(); updateCharCount(); };
});

let typingLock = false;
messageInput.oninput = () => {
  updateCharCount();
  if (!typingLock && typingRef) {
    typingLock = true;
    typingRef.set({ name: myName, typing: true });
    setTimeout(() => { typingLock = false; typingRef.set({ name: myName, typing: false }); }, 2000);
  }
};
function updateCharCount(){
  const len = messageInput.value.length;
  charCount.textContent = `${len}/130`;
  charCount.classList.toggle("text-red-400", len >= 120);
  charCount.classList.toggle("text-gray-600", len < 120);
}
if (typingRef) {
  typingRef.on("value", (snap) => {
    const t = snap.val();
    if (t && t.typing && t.name !== myName) {
      typingIndicator.textContent = t.name + " sedang mengetik...";
      typingIndicator.classList.remove("hidden");
    } else {
      typingIndicator.classList.add("hidden");
      typingIndicator.textContent = "";
    }
  });
}

function formatMessage(raw){
  const div = document.createElement("div");
  div.textContent = raw;
  let html = div.innerHTML;

  html = html.replace(/\n?&gt; (.*?) \| (.*?)\n/g,
    "<div class='border-l-[3px] border-[var(--thm-bg1)] pl-2 ml-1 my-1 text-[11px] bg-gray-900/40 rounded p-1.5 opacity-90 text-gray-300'><b>$1</b><br><span class='italic'>$2</span></div>");

  html = html.replace(/(https?:\/\/[^\s]+)/g, (url) => {
    if (/\.(jpeg|jpg|gif|png|webp)$/i.test(url)) {
      return `<img src="${url}" class="mt-2 rounded-lg max-h-48 max-w-full object-cover border border-gray-600/50 shadow-md" loading="lazy" onload="sC()" onerror="this.outerHTML='&lt;span class=\\'text-red-400 text-xs italic\\'&gt;[Gambar Gagal]&lt;/span&gt;'.replace(/&lt;/g,'<').replace(/&gt;/g,'>')">`;
    }
    return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="underline text-blue-300">${url}</a>`;
  });

  html = html.replace(/\*(.*?)\*/g, "<b class='font-bold'>$1</b>");
  html = html.replace(/_(.*?)_/g, "<i class='italic'>$1</i>");
  html = html.replace(/~(.*?)~/g, "<strike class='opacity-70'>$1</strike>");
  return html;
}

const msgStore = new Map();

function renderMessage(id, sender, text, ts, isSystem = false){
  const isMe = sender === myName;
  const row = document.createElement("div");
  const nearBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 80;

  row.className = `flex w-full msg-row msg-enter ${isMe || isSystem ? "justify-end" : "justify-start"} gap-2 ${isSystem ? "opacity-80 scale-95" : ""}`;
  row.setAttribute("data-text", (sender + " " + text).toLowerCase());
  row.setAttribute("data-msg-id", id);
  msgStore.set(id, { sender, text });

  const time = (ts ? new Date(ts) : new Date()).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  const avatar = isSystem ? "https://api.dicebear.com/7.x/bottts/svg?seed=System&backgroundColor=ef4444" : avatarUrl(sender);
  const bodyHtml = formatMessage(text);

  const nameLabel = document.createElement("span");
  nameLabel.className = "text-[10px] font-bold text-gray-500 mb-0.5 ml-1 drop-shadow-sm";
  nameLabel.textContent = sender;

  const avatarImg = `<img src="${avatar}" class="w-8 h-8 rounded-full bg-gray-800 flex-shrink-0 mt-1 shadow-sm border border-gray-700">`;

  const bubble = document.createElement("div");
  bubble.className = "flex flex-col " + (isMe || isSystem ? "items-end" : "items-start") + " max-w-[75%]";
  bubble.innerHTML = `
    <div data-action="copy" class="px-4 py-2 cursor-pointer ${isMe ? "bubble-me text-white rounded-2xl rounded-tr-sm" : isSystem ? "bg-amber-500/10 text-amber-200 rounded-2xl rounded-tr-sm border border-amber-500/20" : "bubble-other text-gray-100 rounded-2xl rounded-tl-sm"}">
      <p class="text-[14.5px] leading-relaxed break-words">${bodyHtml}</p>
    </div>
    <span class="text-[9px] font-medium text-gray-600 mt-1 ${isMe || isSystem ? "mr-1" : "ml-1"} flex items-center gap-2">
      ${time}
      ${!isMe && !isSystem ? `<button data-action="reply" class="text-[var(--thm-bg1)] hover:text-white transition-colors" title="Balas"><i class="fa-solid fa-reply"></i></button>` : ""}
    </span>`;
  if (!isMe && !isSystem) bubble.prepend(nameLabel);

  if (!isMe && !isSystem) row.insertAdjacentHTML("beforeend", avatarImg);
  row.appendChild(bubble);
  if (isMe || isSystem) row.insertAdjacentHTML("beforeend", avatarImg);

  chatBox.insertBefore(row, scrollAnchor);

  if (nearBottom || isMe) {
    scrollToBottom();
  } else if (!isSystem) {
    unreadCount++;
    jumpCount.textContent = unreadCount + " pesan baru";
    jumpBtn.classList.remove("hidden");
    jumpBtn.classList.add("flex");
  }

  if (!isMe && !isSystem && soundOn) {
    const p = pop.play();
    if (p !== undefined) p.catch(() => {});
  }
}

let unreadCount = 0;
chatBox.addEventListener("click", (e) => {
  const actionEl = e.target.closest("[data-action]");
  if (!actionEl) return;
  const row = e.target.closest(".msg-row");
  if (!row) return;
  const id = row.getAttribute("data-msg-id");
  const data = msgStore.get(id);
  if (!data) return;

  if (actionEl.dataset.action === "reply") {
    e.stopPropagation();
    window.setReply(data.sender, data.text);
  } else if (actionEl.dataset.action === "copy") {
    navigator.clipboard.writeText(data.text).then(() => window.sT("Pesan disalin!")).catch(() => {});
  }
});

window.sC = function(){
  scrollAnchor.scrollIntoView({ behavior: "smooth", block: "end" });
};
function scrollToBottom(){
  window.sC();
  unreadCount = 0;
  jumpBtn.classList.add("hidden");
  jumpBtn.classList.remove("flex");
}
jumpBtn.onclick = scrollToBottom;
chatBox.addEventListener("scroll", () => {
  const nearBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 40;
  if (nearBottom) { unreadCount = 0; jumpBtn.classList.add("hidden"); jumpBtn.classList.remove("flex"); }
});

if (messagesRef) {
  messagesRef.limitToLast(50).on("child_added", (snap) => {
    loadingMsg.classList.add("opacity-0", "pointer-events-none");
    const v = snap.val();
    if (v && v.text) renderMessage(snap.key, v.sender, v.text, v.timestamp);
  }, () => {
    window.sT("Database Dikunci!");
  });
}

const BAD_WORDS = ["anjing","babi","monyet","bangsat","kontol","memek","ngentot","goblok","tolol","fuck","shit","bitch","nigga","sex","porn","jancok","dancok","asu","bajingan","kampret","ngehe","titit","pantat","ngewe","pepek","peler","puki","sundala","telaso","gendeng","edan","bgst","gblk","dick","pussy","cock","boobs","tits","lonte","pelacur","jablay","s3x","fck","njing","bgsd","kntl"];
function censor(text){
  let out = text;
  BAD_WORDS.forEach(w => { out = out.replace(new RegExp(w, "gi"), "***"); });
  return out;
}

let lastSend = 0;
updateCharCount();
messageForm.onsubmit = (e) => {
  e.preventDefault();
  let text = messageInput.value.trim();
  if (text.length === 0) return;
  if (Date.now() - lastSend < 1000) { window.sT("Tunggu 1 detik."); return; }

  text = censor(text);

  if (replyState) {
    const snippet = replyState.m.length > 30 ? replyState.m.substring(0, 30) + "..." : replyState.m;
    text = "\n> " + replyState.n + " | " + snippet + "\n" + text;
    replyState = null;
    replyBox.classList.add("hidden");
  }

  const payload = { sender: myName, text, timestamp: firebase.database.ServerValue.TIMESTAMP };
  messageInput.value = "";
  updateCharCount();
  sendBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';

  messagesRef.push(payload)
    .then(() => { lastSend = Date.now(); })
    .catch(() => window.sT("Gagal kirim pesan!"))
    .finally(() => {
      sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane ml-[-2px] text-lg"></i>';
      messageInput.focus();
    });
};

setTimeout(() => {
  renderMessage(
    "local-welcome-" + Date.now(),
    "⚙️ Sistem",
    "Selamat datang di TChat versi Terbuka (Stable) 👋",
    Date.now(),
    true
  );
}, 1000);

})();
