<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><meta name="description" content="TChat V5.2 — chat realtime ringan untuk mobile"><title>TChat V5.2 HP</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
<header><div class="brand"><div class="logo">T</div><div><b>TChat <small>V5.2</small></b><span id="status">Menghubungkan…</span></div></div><div class="head-actions"><button id="theme" title="Tema">☀</button><button id="reload" title="Muat ulang">↻</button></div></header>
<div class="toolbar"><div class="searchbox"><span>⌕</span><input id="search" placeholder="Cari pesan…"><button id="clearSearch">×</button></div></div>
<main id="messages"><div class="loading">Memuat chat…</div></main>
<footer><div class="quickbar"><button class="quick" data-e="👍">👍</button><button class="quick" data-e="😂">😂</button><button class="quick" data-e="🔥">🔥</button><button class="quick" data-e="❤️">❤️</button><button class="quick" data-e="🎁">🎁</button></div>
<div class="media"><select id="type"><option value="text">💬 Teks</option><option value="image">🖼️ Gambar</option><option value="gift">🎁 Gift</option></select><input id="url" maxlength="200" placeholder="URL gambar/gift (https://…)" hidden></div>
<div class="compose"><textarea id="text" maxlength="200" rows="1" placeholder="Tulis pesan…"></textarea><button id="send">Kirim</button></div><div class="count"><span id="count">0</span>/200 · pesan tersimpan maksimal 7 hari</div></footer>
<div id="toast" class="toast"></div></div><script type="module" src="app.js"></script></body></html>
